# sudo docker-compose up -d
services:
  php:
    #image: php:8.5-fpm
    build: './infrastructure/etc/php'
    environment:
      - WEBSITE_SSL_CERTIFICATE=/etc/nginx/ssl/certs/localhost.crt
      - WEBSITE_SSL_CERTIFICATE_KEY=/etc/nginx/ssl/private/localhost.key
    ports:
      - "80:80"
      - "443:443"
    volumes:
    - ./infrastructure/etc/.bashrc:/root/.bashrc
    - websites:/var/www
    - .:/var/www/lpanel/
    - ./infrastructure/etc/nginx/default.conf:/etc/nginx/conf.d/default.conf
    - ./infrastructure/etc/nginx/static.conf:/etc/nginx/conf.d/static.conf
    - ./infrastructure/etc/nginx/ssl/:/etc/nginx/ssl/
    - ./infrastructure/etc/nginx/conf.d:/etc/nginx/conf.d/
    - ./infrastructure/etc/nginx/sites-available:/etc/nginx/sites-available/
    - ./infrastructure/etc/nginx/sites-enabled:/etc/nginx/sites-enabled/
    working_dir: /var/www/lpanel/
    links:
    - db
    - cache
  cache:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - ./infrastructure/etc/redis/redis.conf:/etc/redis/redis.conf
  db:
    image: mariadb:latest
    ports:
    - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=$DB_DATABASE
      - MYSQL_USER={$DB_USERNAME}
      - MYSQL_PASSWORD={$DB_PASSWORD}
  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      - PMA_ARBITRARY=1
volumes:
  websites:
